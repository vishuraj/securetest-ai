# Built-in defaults of the SecureTest control plane (lowest precedence: application.yml, env vars and
# command-line arguments override every value here).
spring.application.name=securetest-control-plane
spring.flyway.locations=classpath:securetest/controlplane/db
spring.flyway.table=securetest_schema_history
server.error.include-message=always
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
